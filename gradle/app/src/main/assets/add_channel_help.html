<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>频道管理帮助</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f1115;
            color: #f5f7fb;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            width: min(980px, 82vw);
            border: 1px solid #2a313d;
            border-radius: 20px;
            background: #171b22;
            padding: 4vh 3vw;
        }

        h1 {
            margin: 0 0 2.6vh;
            font-size: 4vh;
            font-weight: 600;
        }

        p,
        li {
            margin: 0;
            color: #d7dce4;
            font-size: 2.1vh;
            line-height: 1.9;
        }

        ol,
        ul {
            margin: 0;
            padding-left: 1.8vw;
        }

        .key {
            display: inline-block;
            padding: 0.2vh 0.7vw;
            border-radius: 6px;
            background: #252b35;
            color: #ffffff;
            font-weight: 600;
        }

        .note {
            margin-top: 1vh;
            color: #97a3b4;
        }

        .section {
            margin-top: 2.8vh;
        }

        h2 {
            margin: 0 0 1vh;
            color: #ffc107;
            font-size: 2.3vh;
            font-weight: 600;
        }

        .format {
            display: inline-block;
            margin-top: 1vh;
            padding: 1vh 1vw;
            border-radius: 10px;
            background: #10141a;
            color: #8cc8ff;
            font-family: Consolas, monospace;
            font-size: 2vh;
        }
    </style>
</head>
<body>
<main class="page">
    <h1>TV Auto</h1>

    <ol>
        <li>按遥控器 <span class="key">菜单键</span> 打开频道管理。</li>
        <li>在管理窗口左侧扫描二维码。</li>
        <li>用手机新增、删除、导入或导出频道。</li>
        <li>txt 导入格式
        <div class="format">"频道名称","URL";...</div></li>
    </ol>
    <p class="note">手机管理只在频道管理窗口打开期间可用，关闭窗口后会自动停止。</p>
</main>
</body>
</html>
